name: General Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'database.db'
      - 'mikroc_cmake/**'
      - 'clicks/**'
      - 'demos/**'
      - 'scripts/package_general_release.py'
      - 'scripts/get_all_click_indexes.py'
      - '.github/workflows/general-release.yml'

permissions:
  contents: write

concurrency:
  group: general-release-v0.1.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.0
  RELEASE_TITLE: General Release v0.1.0
  OUTPUT_DIR: dist/general-release
  C_METADATA_ELASTIC_INDEX: ${{ vars.C_METADATA_ELASTIC_INDEX || 'github_live_index' }}

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if ! sudo apt-get install -y 7zip; then
            sudo apt-get install -y p7zip-full
          fi
          python3 -m pip install --disable-pip-version-check 'elasticsearch>=7.17,<8'

      - name: Validate required source folders/files
        shell: bash
        run: |
          set -euo pipefail
          test -d sdk
          test -s sdk/manifest.json
          test -s database.db
          test -d mikroc_cmake
          test -d clicks
          test -d demos
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('sdk/manifest.json').read_text(encoding='utf-8'))
          version = str(manifest.get('version', '')).strip()
          if not version:
              raise SystemExit('sdk/manifest.json must contain a non-empty "version" field')
          print(f'SDK version from sdk/manifest.json: {version}')
          PY

      - name: Build SDK, mikroC CMake, Rust Click and Rust Demo assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_general_release.py \
            --sdk sdk \
            --database database.db \
            --mikroc-cmake mikroc_cmake \
            --clicks clicks \
            --demos demos \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --output "$OUTPUT_DIR"

      - name: Generate C Click and Demo metadata from Elasticsearch
        env:
          ELASTICSEARCH_HOST: ${{ secrets.ELASTICSEARCH_HOST }}
          ELASTICSEARCH_USER: ${{ secrets.ELASTICSEARCH_USER }}
          ELASTICSEARCH_PASSWORD: ${{ secrets.ELASTICSEARCH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ELASTICSEARCH_HOST" || { echo 'Missing secret ELASTICSEARCH_HOST' >&2; exit 1; }
          test -n "$ELASTICSEARCH_USER" || { echo 'Missing secret ELASTICSEARCH_USER' >&2; exit 1; }
          test -n "$ELASTICSEARCH_PASSWORD" || { echo 'Missing secret ELASTICSEARCH_PASSWORD' >&2; exit 1; }

          cd "$OUTPUT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/get_all_click_indexes.py" \
            "$C_METADATA_ELASTIC_INDEX" \
            "$ELASTICSEARCH_HOST" \
            "$ELASTICSEARCH_USER" \
            "$ELASTICSEARCH_PASSWORD"
          test -s metadata_clicks_c.json
          test -s metadata_demos_c.json

      - name: Show generated assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'Generated General Release assets:'
          find "$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create General Release v0.1.0 if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes 'General Rusty_MikroBUS assets: Rust SDK, database, mikroC CMake module, Rust Click/Demo packages and C/Rust example metadata.' \
              --latest=false
          fi

      - name: Upload only new or changed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          remote_assets="$(gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | jq -s 'add // []')"

          changed=0
          unchanged=0
          while IFS= read -r file; do
            asset="$(basename "$file")"
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$asset" '.[] | select(.name == $name) | (.digest // "")' <<<"$remote_assets" | head -n1)"

            if [[ "$remote_digest" == "sha256:${local_sha}" ]]; then
              echo "UNCHANGED  $asset"
              unchanged=$((unchanged + 1))
              continue
            fi

            echo "UPLOAD     $asset  sha256:$local_sha"
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            changed=$((changed + 1))
          done < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -print | sort)

          echo "Upload complete: $changed changed/new, $unchanged unchanged."

      - name: Remove stale Rust Click/Demo archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            | jq -rs 'add // [] | .[] | select(.name | startswith("rust_click_") or startswith("rust_demo_")) | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r asset_id asset_name; do
                if [[ ! -f "$OUTPUT_DIR/$asset_name" ]]; then
                  echo "DELETE stale asset $asset_name"
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done
