name: General Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'database.db'
      - 'mikroc_cmake/**'
      - 'scripts/package_general_release.py'
      - '.github/workflows/general-release.yml'

permissions:
  contents: write

concurrency:
  group: general-release-v0.1.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.0
  RELEASE_TITLE: General Release v0.1.0
  OUTPUT_DIR: dist/general-release

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if ! sudo apt-get install -y 7zip; then
            sudo apt-get install -y p7zip-full
          fi

      - name: Validate required source folders/files
        shell: bash
        run: |
          set -euo pipefail
          test -d sdk
          test -s sdk/manifest.json
          test -s database.db
          test -d mikroc_cmake
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('sdk/manifest.json').read_text(encoding='utf-8'))
          version = str(manifest.get('version', '')).strip()
          if not version:
              raise SystemExit('sdk/manifest.json must contain a non-empty "version" field')
          print(f'SDK version from sdk/manifest.json: {version}')
          PY

      - name: Build shared General Release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_general_release.py \
            --sdk sdk \
            --database database.db \
            --mikroc-cmake mikroc_cmake \
            --output "$OUTPUT_DIR"

      - name: Show generated assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'Generated General Release assets:'
          find "$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create General Release v0.1.0 if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes 'Shared Rusty_MikroBUS assets: Rust SDK, database and mikroC CMake module. Click and Demo examples are maintained in dedicated releases.' \
              --latest=false
          fi

      - name: Upload only new or changed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          remote_assets="$(gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | jq -s 'add // []')"

          changed=0
          unchanged=0
          while IFS= read -r file; do
            asset="$(basename "$file")"
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_digest="$(jq -r --arg name "$asset" '.[] | select(.name == $name) | (.digest // "")' <<<"$remote_assets" | head -n1)"

            if [[ "$remote_digest" == "sha256:${local_sha}" ]]; then
              echo "UNCHANGED  $asset"
              unchanged=$((unchanged + 1))
              continue
            fi

            echo "UPLOAD     $asset  sha256:$local_sha"
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            changed=$((changed + 1))
          done < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -print | sort)

          echo "Upload complete: $changed changed/new, $unchanged unchanged."
